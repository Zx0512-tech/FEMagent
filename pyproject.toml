[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "femagent-core"
version = "0.1.0"
description = "Deterministic finite-element engineering core for FEMagent"
requires-python = ">=3.13"
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
opensees = [
  "openseespy==3.8.0.0",
]
ansys-results = [
  "ansys-mapdl-reader==0.56.0",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["fem_core*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"fem_core/solvers/opensees_generated_analysis.py" = ["I001"]
