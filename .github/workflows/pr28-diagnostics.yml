name: PR28 diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --no-frozen-lockfile
      - run: python -m pip install -e ".[dev,opensees,ansys-results]"
      - name: Typecheck
        continue-on-error: true
        run: pnpm typecheck > diagnostics-typecheck.log 2>&1
      - name: TS tests
        continue-on-error: true
        run: pnpm test:ts > diagnostics-ts.log 2>&1
      - name: Python tests
        continue-on-error: true
        run: python -m pytest > diagnostics-pytest.log 2>&1
      - name: Ruff
        continue-on-error: true
        run: python -m ruff check fem_core tests/python examples/ansys/golden_path > diagnostics-ruff.log 2>&1
      - name: Smokes
        continue-on-error: true
        run: |
          {
            python -c "from fem_core.solvers import get_solver_adapter; s=get_solver_adapter('opensees').status(); assert s['available'], s"
            python -c "from ansys.mapdl import reader; assert callable(reader.read_binary)"
            pnpm fem:health
          } > diagnostics-smoke.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28-diagnostics
          path: diagnostics-*.log
