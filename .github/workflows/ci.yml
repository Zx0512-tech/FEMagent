name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge:
    name: Engineering tool bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install TypeScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Python core
        run: python -m pip install -e ".[dev]"

      - name: Typecheck
        run: pnpm typecheck

      - name: TypeScript engineering bridge tests
        run: pnpm test:ts

      - name: Python engineering core tests
        run: python -m pytest

      - name: Python lint
        run: python -m ruff check fem_core tests/python

      - name: Health smoke
        run: pnpm fem:health
